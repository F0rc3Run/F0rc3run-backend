name: F0rc3Run VPN Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: f0rc3run-vpn-configs
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Destination Repo
        uses: actions/checkout@v4
        with:
          repository: F0rc3run/F0rc3run
          token: ${{ secrets.PAT }}
          path: final-destination

      - name: 🔐 Checkout Private Source Repo
        uses: actions/checkout@v4
        with:
          repository: F0rc3Run/vpn-config
          token: ${{ secrets.PAT }}
          path: source-app

      - name: ⚙️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # go.sum is generated by `go mod tidy` below, so it does not exist at
          # this point. Letting setup-go look for it would fail the step.
          cache: false

      - name: 💾 Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('source-app/go.mod') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🏷️ Resolve latest Xray-core version
        id: xray-version
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  https://api.github.com/repos/XTLS/Xray-core/releases/latest \
                | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then TAG="unknown-$(date -u +%Y%m%d)"; fi
          echo "Latest Xray-core: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Xray Core
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: ./source-app/xray
          # The old key had no version in it, so the very first cached binary
          # was reused forever and "latest" never actually updated.
          key: ${{ runner.os }}-xray-${{ steps.xray-version.outputs.tag }}

      - name: 🔽 Download Xray Core
        if: steps.cache-xray.outputs.cache-hit != 'true'
        working-directory: ./source-app
        run: |
          set -euo pipefail
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q xray.zip xray
          chmod +x xray
          rm -f xray.zip

      - name: 🔎 Verify Xray
        working-directory: ./source-app
        run: ./xray version

      - name: 🚀 Run Go App to Generate All Files
        working-directory: ./source-app
        run: |
          set -euo pipefail
          ulimit -n 65535 || true
          go mod tidy
          go build -o checker .
          ./checker

      - name: 📊 Show Summary
        working-directory: ./source-app
        run: cat summary.md || true

      - name: 📂 Organize Output Files
        run: |
          set -euo pipefail
          SRC=./source-app
          DST=./final-destination

          # Stale entries must go first, otherwise countries that dropped out
          # of the results keep a file forever.
          rm -rf "$DST/splitted-by-protocol" "$DST/splitted-by-country"
          mkdir -p "$DST/Best-Results"

          # Unchanged destinations
          mv -f "$SRC/proxies.txt"           "$DST/Best-Results/"
          mv -f "$SRC/sub.txt"               "$DST/Best-Results/"
          mv -f "$SRC/summary.md"            "$DST/"
          mv -f "$SRC/splitted-by-protocol"  "$DST/"
          mv -f "$SRC/splitted-by-country"   "$DST/"

          # New Clash outputs, next to the other subscription files.
          # Optional in config.yaml, so absence is not an error.
          for f in clash.yaml clash-provider.yaml; do
            if [ -f "$SRC/$f" ]; then
              mv -f "$SRC/$f" "$DST/Best-Results/"
            else
              echo "note: $f was not generated (disabled in config.yaml)"
            fi
          done

          # stats.json is the full raw result set — kept out of the public repo.
          rm -f "$SRC/stats.json"

          echo "--- published tree ---"
          ls -la "$DST/Best-Results"

      - name: ✨ Commit and Push All Changes
        working-directory: ./final-destination
        run: |
          set -euo pipefail
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update and categorize proxy lists ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing and retrying."
            git pull --rebase --autostash
          done

          echo "Push failed after 3 attempts."
          exit 1
